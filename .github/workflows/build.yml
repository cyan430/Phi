name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: g++ main.cpp -o main.exe -Irlb/include -Lrlb/lib -lraylib -lgdi32 -lwinmm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phi-win64
          path: |
            main.exe
            assets/
